<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11100e" />
  <meta name="description" content="热气食堂，现点现做的美味。" />
  <title>热气食堂 · 点单</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2311100e'/%3E%3Cpath d='M14 37c2 10 10 15 18 15s16-5 18-15H14Z' fill='%23ff8a24'/%3E%3Cpath d='M24 14c-5 6 3 8-2 14M34 10c-5 7 3 9-2 17M44 15c-5 6 3 8-2 14' fill='none' stroke='%23fff5e8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup"><div class="brand-icon" aria-hidden="true">♨</div><div><div class="brand-name">热气食堂</div><div class="brand-sub">刚出锅的好滋味</div></div></div>
      <button class="table-chip" id="tableButton" type="button" aria-label="查看桌号与人数"><span class="table-chip-icon" aria-hidden="true">⌁</span><span><b>A06</b><small>堂食 · <span id="partyDisplay">2</span> 位</small></span><span class="chevron" aria-hidden="true">⌄</span></button>
    </header>
    <main class="main-content">
      <div class="menu-main">
        <section class="welcome"><div><div class="eyebrow">今日菜单 <span></span> 现点现做</div><h1>想吃点<span>热乎的？</span></h1><p>好味道，从这一口开始。</p></div><div class="welcome-mark" aria-hidden="true">热<br>气</div></section>
        <label class="searchbar"><span class="search-icon" aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="今天想吃点什么？" autocomplete="off" /><button id="clearSearch" class="clear-search" type="button" aria-label="清除搜索">×</button></label>
        <section class="hero-card" id="heroCard" aria-label="招牌推荐"><div class="hero-photo" id="heroPhoto"></div><div class="hero-shade"></div><div class="hero-copy"><span class="hero-label">本店招牌</span><h2>香辣小炒牛肉</h2><p>鲜香翻炒，热气腾腾上桌</p><button id="heroButton" type="button">尝尝这道 <span aria-hidden="true">↗</span></button></div><div class="hero-number">01 / 20</div></section>
        <nav class="categories" id="categories" aria-label="菜品分类"></nav>
        <div class="section-heading"><div><p class="eyebrow" id="sectionEyebrow">主厨推荐</p><h2 id="sectionTitle">招牌菜</h2></div><span id="resultCount">6 道美味</span></div>
        <section class="food-grid" id="foodGrid" aria-label="菜品列表"></section>
      </div>
      <aside class="desktop-order" id="desktopOrder" aria-label="当前订单"></aside>
    </main>
    <footer class="site-footer"><span>菜品图片仅作演示参考</span><a href="./credits.html">图片素材来源与许可</a></footer>
  </div>
  <div class="mobile-order-bar" id="mobileOrderBar"></div>
  <div id="overlayRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
